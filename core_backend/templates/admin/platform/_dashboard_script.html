<script>
(function () {
  function showEmpty(id, message) {
    var canvas = document.getElementById(id);
    if (!canvas || !canvas.parentNode) return;
    canvas.parentNode.innerHTML = '<div class="chart-empty">' + message + '</div>';
  }

  function getCanvas(id) {
    var canvas = document.getElementById(id);
    if (!canvas) return null;
    var wrap = canvas.parentNode;
    if (wrap) {
      wrap.style.height = '260px';
      wrap.style.minHeight = '260px';
      wrap.style.position = 'relative';
    }
    canvas.style.display = 'block';
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.removeAttribute('height');
    canvas.removeAttribute('width');
    return canvas;
  }

  function initCharts() {
    if (typeof Chart === 'undefined') {
      ['chartSubStatus', 'chartSubPlan', 'chartBiz']
        .forEach(function (id) { showEmpty(id, 'Chart library failed to load. Hard-refresh the page.'); });
      return;
    }

    var el = document.getElementById('platform-charts');
    if (!el) return;

    var charts;
    try {
      charts = JSON.parse(el.textContent);
    } catch (err) {
      console.error('Platform charts JSON failed', err);
      return;
    }

    var green = '#ad46ff';
    var greenLight = 'rgba(173, 70, 255, 0.15)';
    var palette = ['#ad46ff', '#8b5cf6', '#c27aff', '#3b82f6', '#22c55e', '#06b6d4', '#f59e0b', '#9ca3af'];

    Chart.defaults.font.family = "'Plus Jakarta Sans', system-ui, sans-serif";
    Chart.defaults.color = '#9ca3af';

    function doughnut(id, labels, values, emptyMessage) {
      if (!labels || !labels.length) {
        showEmpty(id, emptyMessage || 'No data yet');
        return;
      }
      var canvas = getCanvas(id);
      if (!canvas) return;
      try {
        new Chart(canvas, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{ data: values, backgroundColor: palette.slice(0, labels.length), borderWidth: 0 }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '62%',
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 12, font: { size: 11 } } } },
          },
        });
      } catch (err) {
        console.error(id, err);
        showEmpty(id, 'Could not render chart');
      }
    }

    doughnut('chartSubStatus', charts.subscriptions_status.labels, charts.subscriptions_status.values, 'No subscriptions yet');
    doughnut('chartSubPlan', charts.subscriptions_plan.labels, charts.subscriptions_plan.values, 'No plan data yet');
    doughnut('chartBiz', charts.business_types.labels, charts.business_types.values, 'No business types yet');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCharts);
  } else {
    initCharts();
  }
})();
</script>
