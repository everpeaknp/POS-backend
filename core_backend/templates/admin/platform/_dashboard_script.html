<script>
(function () {
  function showEmpty(id, message) {
    var canvas = document.getElementById(id);
    if (!canvas || !canvas.parentNode) return;
    canvas.parentNode.innerHTML = '<div class="chart-empty">' + message + '</div>';
  }

  function getCanvas(id) {
    var canvas = document.getElementById(id);
    if (!canvas) return null;
    var wrap = canvas.parentNode;
    if (wrap) {
      wrap.style.height = '260px';
      wrap.style.minHeight = '260px';
      wrap.style.position = 'relative';
    }
    canvas.style.display = 'block';
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.removeAttribute('height');
    canvas.removeAttribute('width');
    return canvas;
  }

  function initCharts() {
    if (typeof Chart === 'undefined') {
      ['chartSignups', 'chartRevenue', 'chartSubStatus', 'chartSubPlan', 'chartModules', 'chartBiz']
        .forEach(function (id) { showEmpty(id, 'Chart library failed to load. Hard-refresh the page.'); });
      return;
    }

    var el = document.getElementById('platform-charts');
    if (!el) return;

    var charts;
    try {
      charts = JSON.parse(el.textContent);
    } catch (err) {
      console.error('Platform charts JSON failed', err);
      return;
    }

    var green = '#22c55e';
    var greenLight = 'rgba(34, 197, 94, 0.15)';
    var palette = ['#22c55e', '#3b82f6', '#8b5cf6', '#f59e0b', '#ef4444', '#06b6d4', '#ec4899', '#64748b'];

    Chart.defaults.font.family = "system-ui, sans-serif";
    Chart.defaults.color = '#64748b';

    function lineChart(id, labels, values, label) {
      var canvas = getCanvas(id);
      if (!canvas) return;
      try {
        new Chart(canvas, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: label,
              data: values,
              borderColor: green,
              backgroundColor: greenLight,
              fill: true,
              tension: 0.35,
              pointRadius: 2,
              pointHoverRadius: 5,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { display: false }, ticks: { maxTicksLimit: 8, font: { size: 10 } } },
              y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
            },
          },
        });
      } catch (err) {
        console.error(id, err);
        showEmpty(id, 'Could not render chart');
      }
    }

    function doughnut(id, labels, values, emptyMessage) {
      if (!labels || !labels.length) {
        showEmpty(id, emptyMessage || 'No data yet');
        return;
      }
      var canvas = getCanvas(id);
      if (!canvas) return;
      try {
        new Chart(canvas, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{ data: values, backgroundColor: palette.slice(0, labels.length), borderWidth: 0 }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '62%',
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 12, font: { size: 11 } } } },
          },
        });
      } catch (err) {
        console.error(id, err);
        showEmpty(id, 'Could not render chart');
      }
    }

    function barH(id, labels, values, emptyMessage) {
      if (!labels || !labels.length) {
        showEmpty(id, emptyMessage || 'No data yet');
        return;
      }
      var canvas = getCanvas(id);
      if (!canvas) return;
      try {
        new Chart(canvas, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{ data: values, backgroundColor: green, borderRadius: 6, barThickness: 18 }],
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { beginAtZero: true, grid: { color: '#f1f5f9' } },
              y: { grid: { display: false } },
            },
          },
        });
      } catch (err) {
        console.error(id, err);
        showEmpty(id, 'Could not render chart');
      }
    }

    lineChart('chartSignups', charts.signups.labels, charts.signups.values, 'Signups');
    lineChart('chartRevenue', charts.revenue.labels, charts.revenue.values, 'Revenue (NPR)');
    doughnut('chartSubStatus', charts.subscriptions_status.labels, charts.subscriptions_status.values, 'No subscriptions yet');
    doughnut('chartSubPlan', charts.subscriptions_plan.labels, charts.subscriptions_plan.values, 'No plan data yet');
    barH('chartModules', charts.modules.labels, charts.modules.values, 'No module adoption yet');
    doughnut('chartBiz', charts.business_types.labels, charts.business_types.values, 'No business types yet');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCharts);
  } else {
    initCharts();
  }
})();
</script>
