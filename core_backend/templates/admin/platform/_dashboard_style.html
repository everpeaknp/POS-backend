<style>
  .khata-analytics {
    --green: #22c55e; --green-dim: #16a34a; --slate: #1e2a3b; --muted: #64748b;
    --radius: 0.75rem; --radius-sm: 0.625rem;
    --shadow-sm: 0 1px 2px 0 rgba(0,0,0,.05);
  }
  .khata-analytics .page-header { margin-bottom: 1.5rem; }
  .khata-analytics .page-header h1 { font-size: 1.5rem; font-weight: 600; color: #0f172a; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
  .khata-analytics .page-header p { color: var(--muted); margin: 0; font-size: 0.875rem; }

  /* Cards match frontend's actual pattern (PlanCard.tsx): white,
     border-gray-100, shadow-sm, rounded-xl, p-5 — not borderless. */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .kpi-card {
    background: #fff; border: 1px solid #f3f4f6; border-radius: var(--radius); padding: 1.25rem;
    box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
  }
  .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--green); }
  .kpi-card.warn::before { background: #f59e0b; }
  .kpi-card.danger::before { background: #ef4444; }
  .kpi-card.info::before { background: #3b82f6; }
  .kpi-label { font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .kpi-value { font-size: 1.75rem; font-weight: 600; color: #0f172a; margin-top: 0.35rem; line-height: 1.1; letter-spacing: -0.02em; }
  .kpi-sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; }

  .chart-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
  @media (max-width: 1100px) { .chart-grid { grid-template-columns: 1fr; } }
  .chart-card {
    background: #fff; border: 1px solid #f3f4f6; border-radius: var(--radius); padding: 1.25rem;
    box-shadow: var(--shadow-sm);
  }
  .chart-card h3 { font-size: 0.9375rem; font-weight: 600; color: #0f172a; margin: 0 0 1rem; letter-spacing: -0.01em; }
  /* Bootstrap/Jazzmin set canvas { height: auto }, which collapses Chart.js */
  .chart-wrap {
    position: relative;
    width: 100%;
    height: 260px;
    min-height: 260px;
  }
  .chart-wrap canvas {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    max-width: none !important;
    max-height: none !important;
  }
  .chart-empty {
    height: 260px; display: flex; align-items: center; justify-content: center;
    color: #94a3b8; font-size: 0.85rem; text-align: center; padding: 1rem;
  }

  .tables-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 900px) { .tables-grid { grid-template-columns: 1fr; } }
  .data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.85rem; }
  .data-table th { text-align: left; padding: 0.65rem 0.85rem; background: #f8fafc; color: var(--muted); font-weight: 700; font-size: 0.6875rem; text-transform: uppercase; letter-spacing: .04em; }
  .data-table th:first-child { border-radius: var(--radius-sm) 0 0 0; }
  .data-table th:last-child { border-radius: 0 var(--radius-sm) 0 0; }
  .data-table td { padding: 0.65rem 0.85rem; border-top: 1px solid #f1f5f9; color: #334155; }
  .data-table tbody tr { transition: background-color 0.12s ease; }
  .data-table tbody tr:hover { background-color: rgba(34,197,94,.05); }

  .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.01em; }
  .badge-ok { background: #dcfce7; color: #166534; }
  .badge-warn { background: #fef3c7; color: #92400e; }
  .badge-bad { background: #fee2e2; color: #991b1b; }
  .badge-muted { background: #f1f5f9; color: #475569; }

  .quick-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
  .quick-actions a, .quick-actions button {
    display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.55rem 1.1rem;
    border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; text-decoration: none; border: 1px solid #e2e8f0;
    background: #fff; color: #334155; cursor: pointer;
    box-shadow: var(--shadow); transition: box-shadow 0.15s ease, border-color 0.15s ease, transform 0.1s ease, background-color 0.15s ease, color 0.15s ease;
  }
  .quick-actions a:hover, .quick-actions button:hover { border-color: var(--green); color: var(--green-dim); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .quick-actions .primary { background: var(--green); color: #fff; border-color: var(--green); box-shadow: 0 1px 2px rgba(34,197,94,.3); }
  .quick-actions .primary:hover { background: var(--green-dim); color: #fff; }
</style>
